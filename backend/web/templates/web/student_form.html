{% extends 'web/base.html' %}
{% block page_title %}Add Student{% endblock %}
{% block content %}

<div class="card">
  <div class="card-title">
    <h3>Add New Student</h3>
    <a class="btn btn-sm" href="/students">← Back</a>
  </div>
  <form method="post" action="/students/new/">
    {% csrf_token %}
    <div class="form-grid">
      <div class="form-group">
        <label>Register Number *</label>
        <input name="register_number" value="{{ form.register_number }}" required>
      </div>
      <div class="form-group">
        <label>Full Name *</label>
        <input name="name" value="{{ form.name }}" required>
      </div>
      <div class="form-group">
        <label>Student ID</label>
        <input name="student_id" value="{{ form.student_id }}">
      </div>
      <div class="form-group">
        <label>Admission Number</label>
        <input name="admission_number" value="{{ form.admission_number }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ form.email }}">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input name="phone" value="{{ form.phone }}">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          <option value="MALE" {% if form.gender == 'MALE' %}selected{% endif %}>Male</option>
          <option value="FEMALE" {% if form.gender == 'FEMALE' %}selected{% endif %}>Female</option>
          <option value="OTHER" {% if form.gender == 'OTHER' %}selected{% endif %}>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" value="{{ form.date_of_birth }}">
      </div>
      <div class="form-group">
        <label>Department</label>
        <input name="department" value="{{ form.department }}">
      </div>
      <div class="form-group">
        <label>Address</label>
        <input name="address" value="{{ form.address }}">
      </div>
      <div class="form-group">
        <label>City</label>
        <input name="city" value="{{ form.city }}">
      </div>
      <div class="form-group">
        <label>State</label>
        <input name="state" value="{{ form.state }}">
      </div>
      <div class="form-group">
        <label>GitHub URL</label>
        <input name="github_url" value="{{ form.github_url }}" placeholder="https://github.com/…">
      </div>
      <div class="form-group">
        <label>LinkedIn URL</label>
        <input name="linkedin_url" value="{{ form.linkedin_url }}" placeholder="https://linkedin.com/in/…">
      </div>
      <div class="form-group" style="grid-column: 1 / -1">
        <label>Professional Summary</label>
        <textarea name="professional_summary" placeholder="Short professional summary for the portfolio…">{{ form.professional_summary }}</textarea>
      </div>
    </div>
    <div class="row mt">
      <button class="btn btn-primary" type="submit">Save Student</button>
      {% if user.role == 'HR' %}
        <a class="btn" href="/bulk-upload">Bulk Upload Instead</a>
      {% endif %}
    </div>
  </form>
</div>

{% endblock %}
